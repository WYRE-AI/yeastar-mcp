services:
  # Gateway mode. PBX domain, client ID, and client secret arrive per request
  # on X-Yeastar-Pbx-Domain, X-Yeastar-Client-Id, and X-Yeastar-Client-Secret.
  # Do not set YEASTAR_PBX_DOMAIN, YEASTAR_CLIENT_ID, YEASTAR_CLIENT_SECRET,
  # or env_file here. That would put static vendor credentials in the
  # container. For AUTH_MODE=env, pass those variables on that process
  # instead (see the README).
  yeastar-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
